<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BRASA | MESSA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #111111;
      color: #ffffff;
    }

    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      background: #151515;
    }

    .hero {
      width: 100%;
      min-height: 100vh;

      padding: 32px 24px;

      display: flex;
      flex-direction: column;
      justify-content: space-between;

      background-image:
        linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.18) 0%,
          rgba(0, 0, 0, 0.35) 45%,
          rgba(0, 0, 0, 0.92) 100%
        ),
        url("/brasa-hero.jpg");

      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .messa {
      font-size: 12px;
      letter-spacing: 3px;
      color: #dddddd;
    }

    .table {
      font-size: 12px;
      padding: 8px 12px;

      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 50px;

      color: #ffffff;
      background: rgba(0, 0, 0, 0.15);
    }

    .content {
      padding-bottom: 45px;
    }

    .eyebrow {
      margin-bottom: 14px;

      color: #e8894e;

      text-transform: uppercase;
      letter-spacing: 3px;

      font-size: 12px;
      font-weight: bold;
    }

    h1 {
      margin: 0 0 18px;

      font-family: Georgia, "Times New Roman", serif;
      font-size: 64px;
      font-weight: normal;
      letter-spacing: 4px;
    }

    .description {
      max-width: 360px;
      margin: 0 0 34px;

      color: #e0e0e0;

      line-height: 1.6;
      font-size: 16px;
    }

    .button {
      display: block;

      width: 100%;
      padding: 18px;

      border: none;
      border-radius: 12px;

      background: #d46b32;
      color: #ffffff;

      font-size: 16px;
      font-weight: bold;

      text-align: center;
      text-decoration: none;

      cursor: pointer;
    }

    .button:hover {
      background: #e27a3c;
    }

    .footer {
      padding-top: 24px;

      text-align: center;

      font-size: 10px;
      letter-spacing: 2px;

      color: #999999;
    }
  </style>
</head>

<body>

  <main class="app">

    <section class="hero">

      <div class="top">
        <div class="messa">MESSA</div>
        <div class="table">MESA 08</div>
      </div>

      <div class="content">

        <div class="eyebrow">
          Fuego · Cocina · Experiencia
        </div>

        <h1>BRASA</h1>

        <p class="description">
          Cocina al fuego, ingredientes seleccionados y sabores que nacen de la brasa.
          Descubre nuestra experiencia desde tu mesa.
        </p>

        <button class="button">
          Ver menú
        </button>

        <div class="footer">
          POWERED BY MESSA · BY XPANDE
        </div>

      </div>

    </section>

  </main>

</body>
</html>
