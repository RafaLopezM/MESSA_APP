<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRASA | MESSA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #111111;
      color: #ffffff;
    }

    .app {
      min-height: 100vh;
      max-width: 480px;
      margin: 0 auto;
      background: #151515;
      position: relative;
    }

    .hero {
      min-height: 100vh;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background:
  linear-gradient(
    180deg,
    rgba(0, 0, 0, 0.25) 0%,
    rgba(0, 0, 0, 0.45) 45%,
    rgba(0, 0, 0, 0.92) 100%
  ),
  url('brasa-hero.jpg');

background-size: cover;
background-position: center;
background-repeat: no-repeat;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .messa {
      font-size: 12px;
      letter-spacing: 3px;
      color: #aaaaaa;
    }

    .table {
      font-size: 12px;
      padding: 8px 12px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 50px;
      color: #dddddd;
    }

    .content {
      padding-bottom: 45px;
    }

    .eyebrow {
      color: #d77a43;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 14px;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: 64px;
      font-weight: normal;
      letter-spacing: 4px;
      margin: 0 0 18px;
    }

    .description {
      color: #c9c9c9;
      line-height: 1.6;
      font-size: 16px;
      max-width: 360px;
      margin-bottom: 34px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 12px;
      background: #d46b32;
      color: white;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    .button:hover {
      background: #e27a3c;
    }

    .footer {
      text-align: center;
      font-size: 10px;
      letter-spacing: 2px;
      color: #666666;
      padding-top: 24px;
    }
  </style>
</head>

<body>

  <main class="app">
    <section class="hero">

      <div class="top">
        <div class="messa">MESSA</div>
        <div class="table">MESA 08</div>
      </div>

      <div class="content">
        <div class="eyebrow">Fuego · Cocina · Experiencia</div>

        <h1>BRASA</h1>

        <p class="description">
          Cocina al fuego, ingredientes seleccionados y sabores que nacen de la brasa.
          Descubre nuestra experiencia desde tu mesa.
        </p>

        <button class="button">
          Ver menú
        </button>

        <div class="footer">
          POWERED BY MESSA · BY XPANDE
        </div>
      </div>

    </section>
  </main>

</body>
</html>
